[project]
name = "autovid"
version = "0.1.0"
description = "Automated long-form video production pipeline: topic in, YouTube-ready video out."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autovid = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "dashboard*"]
